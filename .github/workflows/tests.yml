name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Resolve svelte fork revision
        id: fork
        run: |
          sha=$(git ls-remote https://github.com/tomyan/svelte.git refs/heads/svelte-custom-renderer | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache built svelte fork
        id: fork-cache
        uses: actions/cache@v4
        with:
          path: ../svelte-fork
          key: svelte-fork-${{ steps.fork.outputs.sha }}

      - name: Build svelte custom renderer fork
        if: steps.fork-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b svelte-custom-renderer \
            https://github.com/tomyan/svelte.git ../svelte-fork
          cd ../svelte-fork
          pnpm install
          pnpm -C packages/svelte build

      - name: Clone vite-plugin-svelte fork
        run: |
          # package.json points @sveltejs/vite-plugin-svelte at this local
          # fork (feat/per-environment-compiler-options, PR #1318) — it is
          # consumed from source, so it only needs its own deps installed
          git clone --depth 1 -b feat/per-environment-compiler-options \
            https://github.com/tomyan/vite-plugin-svelte.git ../vite-plugin-svelte-fork
          cd ../vite-plugin-svelte-fork/packages/vite-plugin-svelte
          npm install --ignore-scripts --omit=dev

      - name: Install dependencies and link svelte fork
        run: |
          npm install --ignore-scripts
          # Symlink (like the local setup) instead of `npm install <dir>`,
          # which re-resolves the tree and prunes packages (vite-plugin-svelte
          # vanished for the E2E vite builds)
          rm -rf node_modules/svelte
          ln -s "$(pwd)/../svelte-fork/packages/svelte" node_modules/svelte
          # The plugin fork resolves its svelte peer from its own tree
          mkdir -p ../vite-plugin-svelte-fork/packages/vite-plugin-svelte/node_modules
          ln -sfn "$(pwd)/../svelte-fork/packages/svelte" \
            ../vite-plugin-svelte-fork/packages/vite-plugin-svelte/node_modules/svelte
          # node-pty ships no linux prebuilds and --ignore-scripts skipped
          # its build — compile it for the svmux E2E scenario
          npm rebuild node-pty
          # npm's optional-deps bug (npm/cli#4828): the platform binding
          # for rolldown (vite's bundler) is missing from a mac-generated
          # lockfile — fetch it explicitly at the matching version
          rolldown_version=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/rolldown/package.json','utf8')).version")
          npm install --no-save --ignore-scripts "@rolldown/binding-linux-x64-gnu@$rolldown_version"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E scenarios
        run: npm run test:e2e
