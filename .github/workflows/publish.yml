name: Publish to npm

# Publishes via npm Trusted Publishing (OIDC) — no stored token. The
# trusted publisher is configured on the @svelterm/core package settings
# on npmjs.com (org: tomyan, repo: svelterm, workflow: publish.yml).
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs a recent npm (>= 11.5.1)
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build svelte custom renderer fork
        run: |
          # tomyan/svelte tracks upstream svelte-custom-renderer plus the
          # svelte/renderer mount export (sveltejs/svelte#18505)
          git clone --depth 1 -b svelte-custom-renderer \
            https://github.com/tomyan/svelte.git ../svelte-fork
          cd ../svelte-fork
          pnpm install
          pnpm -C packages/svelte build

      - name: Install dependencies and link svelte fork
        run: |
          npm install --ignore-scripts
          npm install ../svelte-fork/packages/svelte --no-save

      - name: Build (tsc + precompile devtools)
        run: npm run build

      - name: Publish
        run: npm stage publish --provenance --access public
